<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>安信企业汇报示例</title>
<style>
  :root{--blue:#1457d9;--ink:#102033;--muted:#5d6b7c;--line:#dbe6f5;--bg:#f6f9ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:"Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC",Arial,sans-serif;color:var(--ink)}
  .frame{width:100vw;height:100vh;padding:5vh 5vw;background:linear-gradient(135deg,#fff 0%,#f6f9ff 100%);overflow:hidden}
  .chrome{display:flex;justify-content:space-between;font-size:12px;color:#7a8aa0;margin-bottom:5vh}
  h1{font-size:min(4.2vw,72px);line-height:1.12;margin:0;max-width:980px}
  .lead{font-size:20px;line-height:1.7;color:var(--muted);margin-top:24px;max-width:760px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:12vh}
  .card{background:rgba(255,255,255,.72);border:1px solid var(--line);padding:28px;min-height:210px}
  .num{font-size:52px;line-height:1;color:var(--blue);font-weight:800}
  h3{font-size:24px;margin:14px 0 10px}
  p{margin:0;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<main class="frame">
  <div class="chrome"><span>安信企业汇报 PPT</span><span>示例预览</span></div>
  <h1>按一条主线讲清企业价值，而不是把资料塞进页面</h1>
  <p class="lead">封面、目录、问题、方案、证明、行动建议形成连续叙事；每页都有本页问题和一句话结论。</p>
  <section class="grid">
    <div class="card"><div class="num">01</div><h3>先定论点</h3><p>明确受众、核心判断和汇报目的。</p></div>
    <div class="card"><div class="num">02</div><h3>组织主线</h3><p>按背景、问题、方案、证明、行动推进。</p></div>
    <div class="card"><div class="num">03</div><h3>控制密度</h3><p>标题克制，页面只回答一个核心问题。</p></div>
    <div class="card"><div class="num">04</div><h3>交付完整</h3><p>校验、截图、打包 zip，适合飞书附件发送。</p></div>
  </section>
</main>
</body>
</html>
